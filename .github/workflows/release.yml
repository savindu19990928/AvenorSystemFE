name: Release & Auto Update

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Resolve GitHub Token
        shell: bash
        run: |
          if [ -n "${{ secrets.GH_TOKEN }}" ]; then
            echo "GH_TOKEN=${{ secrets.GH_TOKEN }}" >> $GITHUB_ENV
          elif [ -f electron/github-token.txt ]; then
            TOKEN=$(cat electron/github-token.txt | tr -d '\r\n ')
            echo "GH_TOKEN=$TOKEN" >> $GITHUB_ENV
          else
            echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV
          fi

      - name: Build and Publish Windows App
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish always

      - name: Build and Publish macOS App
        if: matrix.os == 'macos-14'
        run: npx electron-builder --mac --publish always
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
