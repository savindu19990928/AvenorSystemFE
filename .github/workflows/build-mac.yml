name: Build Electron App - macOS ARM64

on:
  workflow_dispatch:

jobs:
  build-mac-arm64:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS Electron App
        run: npm run electron:build:mac:arm64 -- --publish never

      - name: Upload release folder
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          if-no-files-found: error
